
name: vulnbanklab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: vulnbank
      POSTGRES_USER: vulnbank
      POSTGRES_PASSWORD: vulnbank_lab

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnbank -d vulnbank"]
      interval: 4s
      timeout: 3s
      retries: 20

    networks:
      - labnet

  server:
    build:
      context: .
      dockerfile: server/Dockerfile

    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://db:5432/vulnbank
      DB_USER: vulnbank
      DB_PASSWORD: vulnbank_lab
      CERT_PATH: /srv/server.p12
      CERT_PASSWORD: lab-changeit

    ports:
      - "127.0.0.1:8080:8080" # HTTP - Burp Suite lab
      - "127.0.0.1:8443:8443" # Optional HTTPS

    depends_on:
      db:
        condition: service_healthy

    networks:
      - labnet

volumes:
  dbdata:

networks:
  labnet:
    driver: bridge
