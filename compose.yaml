name: vulnbanklab
services:
  # The intentionally vulnerable lab keeps its existing volume and ports.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnbank
      POSTGRES_USER: vulnbank
      POSTGRES_PASSWORD: vulnbank_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnbank -d vulnbank"]
      interval: 4s
      timeout: 3s
      retries: 20
    networks: [vulnnet]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      LAB_MODE: vulnerable
      DB_URL: jdbc:postgresql://db:5432/vulnbank
      DB_USER: vulnbank
      DB_PASSWORD: vulnbank_lab
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [vulnnet]

  # Secure *comparison* is isolated from the intentionally vulnerable DB.
  db_secure:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnbank_secure
      POSTGRES_USER: vulnbank
      POSTGRES_PASSWORD: vulnbank_secure_lab
    volumes:
      - dbdata_secure:/var/lib/postgresql/data
      - ./db/init_secure.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnbank -d vulnbank_secure"]
      interval: 4s
      timeout: 3s
      retries: 20
    networks: [securenet]

  server_secure:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      LAB_MODE: secure
      DB_URL: jdbc:postgresql://db_secure:5432/vulnbank_secure
      DB_USER: vulnbank
      DB_PASSWORD: vulnbank_secure_lab
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db_secure:
        condition: service_healthy
    networks: [securenet]

volumes:
  dbdata:
  dbdata_secure:
networks:
  vulnnet:
    driver: bridge
  securenet:
    driver: bridge
